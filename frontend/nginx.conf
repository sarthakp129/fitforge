# FitForge web tier.
# Serves the built SPA and reverse-proxies /api to the backend container,
# including the SSE endpoint used for streaming plan generation.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The 3D bundle is large-ish; compress everything text-like.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        image/svg+xml font/woff2;

    client_max_body_size 8m;

    # Baseline hardening headers are set per-location below (nginx only inherits
    # add_header into a block that declares none of its own).

    # ---------------------------------------------------------------- api --
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Server-Sent Events (POST /api/ai/plans/*?stream=1). Buffering would
        # hold progress events back until the response finished.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Plan generation can legitimately block for minutes while the token
        # governor waits for the next free window. Do not cut it off early.
        proxy_connect_timeout 15s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ------------------------------------------------------------- assets --
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ---------------------------------------------------------------- spa --
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
